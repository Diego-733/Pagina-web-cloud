<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Producto</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Registrar Producto</h1>

        <form id="formProducto">

            <label for="nombre">
                Nombre del producto
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ej: Notebook Lenovo"
                required
            >

            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                placeholder="Descripción del producto"
                required
            ></textarea>

            <label for="precio">
                Precio
            </label>

            <input
                type="number"
                id="precio"
                placeholder="Ej: 599990"
                min="0"
                required
            >

            <button type="submit">
                Guardar Producto
            </button>

        </form>

        <p id="mensaje"></p>

        <div class="botones">

            <a href="productos.html" class="boton">
                Ver Productos
            </a>

            <a href="../index.html" class="boton secundario">
                Volver al inicio
            </a>

        </div>

    </div>

    <script src="../js/script.js"></script>

</body>

</html>
